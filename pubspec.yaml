name: pinkrain
description: "Health Tracking App"
publish_to: 'none'
version: 2.3.4+1

environment:
  sdk: '>=3.3.4 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & UI Essentials (Down-leveled to fix breaking syntax)
  flutter_svg: ^2.0.10+1
  go_router: ^14.8.0
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  percent_indicator: ^4.2.4
  pretty_animated_text: ^2.0.0
  
  # Data Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  
  # Services & Hardware (Down-leveled to match app code syntax)
  cristalyse: ^1.17.6
  tflite_flutter: ^0.12.1
  pdf: ^3.12.0
  share_plus: ^11.0.0
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.3
  just_audio: ^0.10.5
  url_launcher: ^6.2.5
  http: ^1.6.0
  html: ^0.15.4
  timezone: ^0.10.1
  package_info_plus: ^8.0.0
  
  # Icon Design Packages (Upgraded HUX natively resolves the lucide issue)
  hugeicons: ^1.1.7
  hux: ^1.2.1

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  build_runner: ^2.15.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/fonts/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/audio-tracks/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
