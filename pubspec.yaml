name: pinkrain
description: "Health Tracking App"
publish_to: 'none'
version: 2.3.4+1

environment:
  sdk: '>=3.3.4 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # Core & UI Essentials
  flutter_svg: ^2.0.10+1
  go_router: ^14.8.0
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  percent_indicator: ^4.2.4
  pretty_animated_text: ^3.2.0
  
  # Data Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  
  # Services & Hardware Integration
  cristalyse: ^1.17.6
  tflite_flutter: ^0.12.1
  pdf: ^3.13.0
  share_plus: ^10.1.3
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  just_audio: ^0.10.1
  url_launcher: ^6.3.1
  http: ^1.2.2
  html: ^0.15.4
  timezone: ^0.9.4
  package_info_plus: ^8.1.2
  
  # Icon Design Packages
  hugeicons: ^1.1.7
  hux: ^0.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.15

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/fonts/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/audio-tracks/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
        
